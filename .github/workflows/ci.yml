name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev
      - name: Run unit and smoke tests
        run: uv run pytest -v
      - name: Run Phase 1.5 synthetic signal gate smoke test
        run: uv run python scripts/run_phase15_signal_gate.py --smoke

